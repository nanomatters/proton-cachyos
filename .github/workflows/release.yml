name: Release

on:
  release:
    types: [ published ]
  push:
    tags:
      - 'wineland-*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    strategy:
      matrix:
        include:
          - name: proton-${{ github.ref_name }}-x86_64
            cflags: -O3 -march=nocona -mtune=core-avx2
            rustflags: -Copt-level=3 -Ctarget-cpu=nocona

          - name: proton-${{ github.ref_name }}-x86_64_v3
            cflags: -O3 -march=x86-64-v3 -mtune=core-avx2
            rustflags: -Copt-level=3 -Ctarget-cpu=nocona

          - name: proton-${{ github.ref_name }}-x86_64_wow64
            cflags: -O3 -march=nocona -mtune=core-avx2
            rustflags: -Copt-level=3 -Ctarget-cpu=nocona
            configure: >-
              --enable-wow64
    uses: ./.github/workflows/_job_build.yml
    with:
      name: ${{ matrix.name }}
      cflags: ${{ matrix.cflags }}
      rustflags: ${{ matrix.rustflags }}
      configure: ${{ matrix.configure }}
      continue: false

  release:
    name: Release
    needs: build
    runs-on: ubuntu-slim
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Create release if needed
      id: create
      if: github.event_name == 'push'
      shell: bash
      run: |
        if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
          gh release create "$GITHUB_REF_NAME" \
            --latest \
            --title "$GITHUB_REF_NAME" \
            --notes-from-tag \
            --verify-tag
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload:
    name: Upload
    needs: release
    strategy:
      matrix:
        include:
          - name: proton-${{ github.ref_name }}-x86_64
          - name: proton-${{ github.ref_name }}-x86_64_v3
          - name: proton-${{ github.ref_name }}-x86_64_wow64
    uses: ./.github/workflows/_job_upload.yml
    with:
      version: ${{ github.ref_name }}
      name: ${{ matrix.name }}
